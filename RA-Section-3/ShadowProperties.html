<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 2px solid green;
            background-color: yellowgreen;
            width:100px;
            height: 100px;
            /* box-shadow: 10px 20px 8px 13px gray; */
            box-shadow: inset 10px 10px 5px grey;
        }
        .headone{
            color: red;
            text-shadow: 2px 1px 2px blue;
        }
    </style>
</head>
<body>
    <h1>Box Shadow</h1>
    <div class="box"></div>
    <h1>Text Shadow</h1>
    <h1 class="headone">EEEE</h1>
</body>
</html>
