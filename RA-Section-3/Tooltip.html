<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tooltip{
            position:relative;
            display: inline-block;

        }
        .tooltipdetails{
            border: 2px solid green;
            background-color: aquamarine;
            text-align: center;
            position: absolute;
            left:40px;
            width: 140px;
            top:20px;
            border-radius: 10px;
            visibility: hidden;
        }
        .tooltip:hover .tooltipdetails{
            visibility: visible;
        }
    </style>
</head>
<body>
    <!-- <h1>Tooltip</h1> -->
    <div class="tooltip">
        Tooltip
        <span class="tooltipdetails">This is an Tooltip</span>
    </div>
</body>
</html>
